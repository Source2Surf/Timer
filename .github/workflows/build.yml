name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SurfTimer.slnx

      - name: Publish Timer
        run: >
          dotnet publish Plugin/Timer/Timer.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          -p:CIBuild=true
          -o sharp/modules/Timer
          --no-restore

      - name: Publish Timer.RequestManager
        run: >
          dotnet publish Plugin/Timer.RequestManager/Timer.RequestManager.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          -o sharp/modules/Timer.RequestManager
          --no-restore

      - name: Publish Timer.Shared
        run: >
          dotnet publish Plugin/Timer.Shared/Timer.Shared.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          -o sharp/shared/Timer.Shared
          --no-restore

      - name: Publish Timer.Localization
        run: >
          dotnet publish Plugin/Timer.Localization/Timer.Localization.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          -o sharp/modules/Timer.Localization
          --no-restore

      - name: Publish Timer.MapChooser
        run: >
          dotnet publish Plugin/Timer.MapChooser/Timer.MapChooser.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          -o sharp/modules/Timer.MapChooser
          --no-restore

      # One self-contained executable per platform; trimming and AOT break SqlSugar and MagicOnion.
      - name: Publish Timer.Backend
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish Backend/Timer.Backend/Timer.Backend.csproj \
              -c ${{ env.CONFIGURATION }} \
              -r $rid \
              --self-contained \
              -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=embedded \
              -o backend/$rid
          done

      # Extracting an update must never overwrite a server's own settings.
      - name: Ship configs as examples
        run: for f in sharp/configs/*.jsonc; do mv "$f" "$f.example"; done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurfTimer
          path: sharp/

      - name: Upload backend artifact (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: TimerBackend-linux-x64
          path: backend/linux-x64/

      - name: Upload backend artifact (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: TimerBackend-win-x64
          path: backend/win-x64/

      - name: Package release archives
        if: github.event_name == 'release'
        run: |
          tag=${{ github.event.release.tag_name }}
          (cd sharp && zip -r ../SurfTimer-$tag.zip .)
          (cd backend/linux-x64 && zip -r ../../TimerBackend-$tag-linux-x64.zip .)
          (cd backend/win-x64 && zip -r ../../TimerBackend-$tag-win-x64.zip .)

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SurfTimer-${{ github.event.release.tag_name }}.zip
            TimerBackend-${{ github.event.release.tag_name }}-linux-x64.zip
            TimerBackend-${{ github.event.release.tag_name }}-win-x64.zip
